<?xml version="1.0" encoding="UTF-8"?>
<cfg>
    <!-- Cppcheck configuration for BMCU370t project -->
    
    <!-- Platform and standards -->
    <platform>unix32</platform>
    <std>c++17</std>
    
    <!-- Include directories -->
    <include-paths>
        <dir>src/</dir>
        <dir>esp32_firmware/src/</dir>
        <dir>esp32_firmware/lib/</dir>
    </include-paths>
    
    <!-- Suppressions for embedded development -->
    <suppressions>
        <!-- System includes not available in analysis environment -->
        <suppression>missingIncludeSystem</suppression>
        
        <!-- Embedded-specific patterns -->
        <suppression>unusedFunction</suppression>
        <suppression>constParameter</suppression>
        <suppression>unmatchedSuppression</suppression>
        
        <!-- Platform-specific warnings -->
        <suppression>
            <id>cstyleCast</id>
            <fileName>*</fileName>
        </suppression>
        
        <!-- Arduino/ESP-IDF framework patterns -->
        <suppression>
            <id>shadowVariable</id>
            <fileName>*arduino*</fileName>
        </suppression>
        <suppression>
            <id>shadowVariable</id>
            <fileName>*esp32*</fileName>
        </suppression>
        
        <!-- Allow NULL checks in embedded code -->
        <suppression>
            <id>nullPointerRedundantCheck</id>
            <fileName>*</fileName>
        </suppression>
    </suppressions>
    
    <!-- Addons -->
    <addons>
        <addon>cert</addon>
        <addon>misra</addon>
    </addons>
    
    <!-- Analysis options -->
    <check-config>true</check-config>
    <force>true</force>
    <inconclusive>true</inconclusive>
    
    <!-- Enable specific checks -->
    <enable>
        <check>warning</check>
        <check>style</check>
        <check>performance</check>
        <check>portability</check>
        <check>information</check>
    </enable>
    
    <!-- Embedded-specific defines -->
    <defines>
        <define>ARDUINO</define>
        <define>ESP32</define>
        <define>USB_CDC_ENABLED</define>
        <define>USB_DFU_DUAL_MODE</define>
        <define>SYSCLK_FREQ_144MHz_HSI=144000000</define>
    </defines>
</cfg>