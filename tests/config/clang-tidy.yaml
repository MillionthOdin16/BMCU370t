---
# Clang-tidy configuration for BMCU370t embedded firmware
# Focuses on modern C++, safety, and embedded best practices

Checks: >
  bugprone-*,
  cert-*,
  clang-analyzer-*,
  cppcoreguidelines-*,
  hicpp-*,
  modernize-*,
  performance-*,
  portability-*,
  readability-*,
  -bugprone-easily-swappable-parameters,
  -bugprone-macro-parentheses,
  -cert-dcl16-c,
  -cert-dcl50-cpp,
  -cert-dcl59-cpp,
  -cppcoreguidelines-avoid-magic-numbers,
  -cppcoreguidelines-macro-usage,
  -cppcoreguidelines-non-private-member-variables-in-classes,
  -cppcoreguidelines-owning-memory,
  -cppcoreguidelines-pro-bounds-array-to-pointer-decay,
  -cppcoreguidelines-pro-bounds-constant-array-index,
  -cppcoreguidelines-pro-bounds-pointer-arithmetic,
  -cppcoreguidelines-pro-type-reinterpret-cast,
  -cppcoreguidelines-pro-type-union-access,
  -cppcoreguidelines-pro-type-vararg,
  -hicpp-no-array-decay,
  -hicpp-signed-bitwise,
  -hicpp-vararg,
  -modernize-use-trailing-return-type,
  -readability-function-cognitive-complexity,
  -readability-identifier-length,
  -readability-magic-numbers,
  -readability-named-parameter

WarningsAsErrors: ''

HeaderFilterRegex: '(src|esp32_firmware)/.*\.(h|hpp)$'

AnalyzeTemporaryDtors: false

FormatStyle: file

CheckOptions:
  # Naming conventions
  - key: readability-identifier-naming.ClassCase
    value: CamelCase
  - key: readability-identifier-naming.FunctionCase  
    value: camelCase
  - key: readability-identifier-naming.VariableCase
    value: camelCase
  - key: readability-identifier-naming.ConstantCase
    value: UPPER_CASE
  - key: readability-identifier-naming.MacroCase
    value: UPPER_CASE
  - key: readability-identifier-naming.EnumCase
    value: CamelCase
  - key: readability-identifier-naming.StructCase
    value: CamelCase
  
  # Function complexity limits
  - key: readability-function-size.LineThreshold
    value: '100'
  - key: readability-function-size.StatementThreshold  
    value: '50'
  - key: readability-function-size.BranchThreshold
    value: '15'
  - key: readability-function-size.ParameterThreshold
    value: '6'
  
  # Performance settings
  - key: performance-for-range-copy.WarnOnAllAutoCopies
    value: 'true'
  - key: performance-inefficient-vector-operation.VectorLikeClasses
    value: '::std::vector,::std::deque,::std::list'
  
  # Modernization settings
  - key: modernize-loop-convert.MaxCopySize
    value: '16'
  - key: modernize-loop-convert.MinConfidence
    value: reasonable
  - key: modernize-use-nullptr.NullMacros
    value: 'NULL'
  
  # Embedded-specific adjustments
  - key: cppcoreguidelines-avoid-do-while.IgnoreMacros
    value: 'true'
  - key: hicpp-uppercase-literal-suffix.NewSuffixes
    value: 'L;UL;LL;ULL'