[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    unit: Unit tests for individual components
    simulation: Tests using mocked hardware/simulation
    integration: Integration tests for system interactions
    hil: Hardware-in-the-loop tests requiring real hardware
    slow: Tests that take longer than normal to run
    network: Tests requiring network connectivity
    hardware: Tests requiring specific hardware setup

# Minimum test coverage thresholds
# Uncomment and adjust as needed
# addopts = --cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=70

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning