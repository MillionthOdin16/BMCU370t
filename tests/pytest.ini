[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=esp32_firmware/src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
markers =
    unit: Unit tests for individual components
    integration: Integration tests for full system functionality
    web: Web interface validation tests
    simulation: Hardware simulation tests
    performance: Performance and load tests
    security: Security vulnerability and input validation tests
    error_handling: Error condition and edge case tests
    boundary: Boundary condition and limit tests
    slow: Tests that take longer than 1 second
    network: Tests that require network connectivity
    hardware: Tests that require physical hardware (usually skipped in CI)
    wokwi: Wokwi ESP32 simulator tests
    qemu: QEMU ESP32 emulation tests
    docker: Docker environment tests
    gpio: GPIO and peripheral simulation tests
    browser: Browser automation tests
    environmental: Environmental stress tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
asyncio_mode = auto
timeout = 30