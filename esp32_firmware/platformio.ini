[env:esp32s3]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 specific configuration for 4MB Flash + 2MB PSRAM
board_build.flash_size = 4MB
board_build.psram_type = opi
board_build.memory_type = opi_opi

; USB Host functionality requires ESP32-S3 with native USB-OTG support
board_build.usb_mode = otg
board_build.cdc_on_boot = false

; Flash configuration optimized for ESP32-S3 4MB variant
board_build.flash_mode = dio
board_build.flash_freq = 80m
board_build.f_cpu = 240000000L

; Build flags for USB host and web server functionality
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_TINYUSB_CDC_ENABLED=1
    -DCONFIG_TINYUSB_MSC_ENABLED=0
    -DCONFIG_TINYUSB_HID_ENABLED=0
    -DCORE_DEBUG_LEVEL=3
    -DBMCU370_INTERFACE_VERSION=\"1.0.0\"
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
    -DCONFIG_SPIRAM_CACHE_WORKAROUND=1

; Libraries for USB host, web server, and JSON handling
lib_deps = 
    bblanchon/ArduinoJson@^7.0.4
    esphome/ESPAsyncWebServer-esphome@^3.2.2
    me-no-dev/AsyncTCP@^1.1.1

; File system for web interface files
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Enable USB host debugging and optimize for ESP32-S3
monitor_filters = esp32_exception_decoder
debug_tool = esp-builtin
debug_init_break = tbreak setup