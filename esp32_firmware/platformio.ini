[env:esp32s3]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 N4R2 specific configuration (4MB Flash + 2MB PSRAM)
; N4 = 4MB NAND Flash, R2 = 2MB PSRAM
; Override board defaults for correct 4MB flash size
board_build.flash_size = 4MB
board_build.psram_type = qspi
board_build.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Override board JSON defaults that might force 8MB
board_build.variant = esp32s3
board_build.mcu = esp32s3
board_build.f_flash = 80000000L

; USB Host functionality requires ESP32-S3 with native USB-OTG support
; ESP32-S3 N4R2 has enhanced USB capabilities
board_build.usb_mode = otg
board_build.cdc_on_boot = false

; Flash configuration optimized for ESP32-S3 N4R2 (4MB Flash + 2MB OPI PSRAM)
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.f_cpu = 240000000L
board_build.boot = dio

; Build flags for ESP32-S3 N4R2 with USB host and web server functionality
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_TINYUSB_CDC_ENABLED=1
    -DCONFIG_TINYUSB_MSC_ENABLED=0
    -DCONFIG_TINYUSB_HID_ENABLED=0
    -DCORE_DEBUG_LEVEL=3
    -DBMCU370_INTERFACE_VERSION=\"1.0.0\"
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
    -DCONFIG_SPIRAM_CACHE_WORKAROUND=1
    -DCONFIG_SPIRAM_SPEED_80M=1
    -DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1
    -DESP32_S3_N4R2_VARIANT=1
    ; Critical: Force 4MB flash size recognition for N4R2 hardware
    -DCONFIG_ESPTOOLPY_FLASHSIZE_4MB=1
    -DCONFIG_ESPTOOLPY_FLASHSIZE=\"4MB\"
    -DCONFIG_ESPTOOLPY_FLASHSIZE_DETECT=0
    ; PSRAM configuration for QSPI mode (compatible with most N4R2 variants)
    -DCONFIG_SPIRAM_MODE_QUAD=1
    -DCONFIG_SPIRAM_TYPE_ESPPSRAM32=1

; Libraries for USB host, web server, and JSON handling
lib_deps = 
    bblanchon/ArduinoJson@^7.0.4
    esphome/ESPAsyncWebServer-esphome@^3.2.2
    me-no-dev/AsyncTCP@^1.1.1

; File system for web interface files
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Enable USB host debugging and optimize for ESP32-S3 N4R2
monitor_filters = esp32_exception_decoder
debug_tool = esp-builtin
debug_init_break = tbreak setup