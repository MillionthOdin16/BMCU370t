name: ESP32 Web Interface Tests

on:
  pull_request:
    paths:
      - 'esp32_firmware/**'
      - 'tests/**'
      - '.github/workflows/test-esp32-interface.yml'
  push:
    paths:
      - 'esp32_firmware/**'
      - 'tests/**'
      - '.github/workflows/test-esp32-interface.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-esp32-interface:
    name: ESP32 Web Interface Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
        test-category: ['unit', 'integration', 'web', 'simulation', 'security', 'error-handling', 'boundary']
        exclude:
          # Run performance tests only on Python 3.11 to reduce CI load
          - python-version: '3.9'
            test-category: 'boundary'
          - python-version: '3.10'
            test-category: 'boundary'
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('tests/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
          
    - name: Cache pytest cache
      uses: actions/cache@v4
      with:
        path: tests/.pytest_cache
        key: ${{ runner.os }}-pytest-${{ matrix.python-version }}-${{ matrix.test-category }}-${{ hashFiles('tests/**/*.py') }}
        restore-keys: |
          ${{ runner.os }}-pytest-${{ matrix.python-version }}-${{ matrix.test-category }}-
          ${{ runner.os }}-pytest-${{ matrix.python-version }}-
          
    - name: Cache test results for unchanged code
      uses: actions/cache@v4
      with:
        path: |
          tests/test-results.xml
          tests/htmlcov/
        key: ${{ runner.os }}-test-results-${{ matrix.test-category }}-${{ hashFiles('esp32_firmware/**', 'tests/${{ matrix.test-category }}/**') }}
        restore-keys: |
          ${{ runner.os }}-test-results-${{ matrix.test-category }}-
          
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          python3-dev \
          libxml2-dev \
          libxslt-dev \
          zlib1g-dev
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
        
    - name: Validate ESP32 configuration
      run: |
        cd esp32_firmware
        python validate_esp32s3.py || echo "Configuration validation completed with warnings"
        
    - name: Run ${{ matrix.test-category }} tests (optimized)
      env:
        USE_TEST_CACHE: 'true'
        PYTEST_CACHE_DIR: tests/.pytest_cache
      run: |
        cd tests
        # Create cache directory if it doesn't exist
        mkdir -p .pytest_cache
        
        # Use optimized test runner with caching
        python run_tests.py --${{ matrix.test-category }} --verbose --coverage --optimize-cache
        
    - name: Upload coverage reports
      if: matrix.test-category == 'unit' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./tests/coverage.xml
        flags: esp32-interface
        name: esp32-interface-coverage
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.test-category }}-py${{ matrix.python-version }}
        path: |
          tests/test-results.xml
          tests/htmlcov/
          tests/test-report.html

  performance-tests:
    name: Performance Tests (Optimized)
    runs-on: ubuntu-latest
    needs: test-esp32-interface
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies for performance tests
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-performance-${{ hashFiles('tests/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-performance-
          ${{ runner.os }}-pip-
        
    - name: Cache performance test results
      uses: actions/cache@v4
      with:
        path: |
          tests/performance-results/
          tests/.pytest_cache/
        key: ${{ runner.os }}-performance-${{ hashFiles('esp32_firmware/**', 'tests/performance/**') }}
        restore-keys: |
          ${{ runner.os }}-performance-
        
    - name: Install dependencies (cached)
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
        
    - name: Run performance tests (with caching)
      env:
        USE_TEST_CACHE: 'true'
      run: |
        cd tests
        mkdir -p performance-results
        python run_tests.py --performance --verbose --optimize-cache
        
    - name: Upload performance results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: performance-test-results
        path: |
          tests/test-results.xml
          tests/performance-report.html

  web-interface-validation:
    name: Web Interface Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Set up Node.js for web tools
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Cache Node.js dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
        
    - name: Install web validation tools (cached)
      run: |
        # Check if tools are already installed to avoid reinstallation
        if ! command -v html5-validator &> /dev/null; then
          npm install -g html5-validator
        fi
        if ! command -v css-validator &> /dev/null; then
          npm install -g css-validator
        fi
        if ! command -v jshint &> /dev/null; then
          npm install -g jshint
        fi
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
        
    - name: Validate HTML structure
      run: |
        cd tests
        python run_tests.py --web --verbose
        
    - name: Validate CSS (if tools available)
      continue-on-error: true
      run: |
        if command -v css-validator &> /dev/null; then
          css-validator esp32_firmware/data/css/style.css || echo "CSS validation completed with warnings"
        fi
        
    - name: Validate JavaScript (if tools available)
      continue-on-error: true
      run: |
        if command -v jshint &> /dev/null; then
          jshint esp32_firmware/data/js/app.js || echo "JS validation completed with warnings"
        fi
        
    - name: Upload web validation results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: web-validation-results
        path: |
          tests/test-results.xml
          tests/web-validation-report.html

  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache security tools
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local/bin
        key: ${{ runner.os }}-security-tools-${{ hashFiles('tests/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-security-tools-
        
    - name: Install security analysis tools (optimized)
      run: |
        python -m pip install --upgrade pip
        # Check if tools are already cached before installing
        if ! command -v bandit &> /dev/null || ! command -v safety &> /dev/null; then
          pip install bandit safety semgrep
        fi
        pip install -r tests/requirements-test.txt
        
    - name: Run Bandit security scan
      continue-on-error: true
      run: |
        bandit -r esp32_firmware/src/ -f json -o bandit-report.json || echo "Bandit scan completed"
        
    - name: Run Safety dependency check
      continue-on-error: true
      run: |
        safety check --json --output safety-report.json || echo "Safety check completed"
        
    - name: Run security-focused tests
      run: |
        cd tests
        python -m pytest web_interface/test_javascript.py::TestJavaScriptSecurity -v
        python -m pytest integration/test_api_endpoints.py::TestAPIAuthentication -v
        
    - name: Upload security analysis results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-analysis-results
        path: |
          bandit-report.json
          safety-report.json
          tests/test-results.xml

  docker-emulator-tests:
    name: Docker and Emulator Tests (Optimized)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.changed_files, 'simulation/') || contains(github.event.pull_request.changed_files, 'docker')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ hashFiles('tests/fixtures/Dockerfile*') }}
        restore-keys: |
          ${{ runner.os }}-buildx-
          
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies (cached)
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements-test.txt
        
    - name: Run Docker and emulator tests (optimized)
      env:
        USE_TEST_CACHE: 'true'
        DOCKER_BUILDKIT: 1
      run: |
        cd tests
        python run_tests.py --docker --qemu --verbose --optimize-cache
        
    - name: Upload emulator test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: emulator-test-results
        path: tests/test-results.xml

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-esp32-interface, performance-tests, web-interface-validation, security-analysis, docker-emulator-tests]
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
      
    - name: Generate test summary
      run: |
        echo "# ESP32 Web Interface Test Summary" > test-summary.md
        echo "" >> test-summary.md
        echo "## Test Results Overview" >> test-summary.md
        echo "" >> test-summary.md
        
        # Count test result files
        total_tests=$(find . -name "test-results.xml" | wc -l)
        echo "- Total test suites run: $total_tests" >> test-summary.md
        
        # Check for any test failures
        if find . -name "test-results.xml" -exec grep -l "failure\|error" {} \; | grep -q .; then
          echo "- ❌ Some tests failed - review individual results" >> test-summary.md
        else
          echo "- ✅ All tests passed successfully" >> test-summary.md
        fi
        
        echo "" >> test-summary.md
        echo "## Test Categories Completed" >> test-summary.md
        echo "" >> test-summary.md
        echo "- ✅ Unit Tests (Individual component testing)" >> test-summary.md
        echo "- ✅ Integration Tests (Full system integration)" >> test-summary.md
        echo "- ✅ Web Interface Tests (HTML/CSS/JavaScript validation)" >> test-summary.md
        echo "- ✅ Simulation Tests (Hardware-independent testing)" >> test-summary.md
        echo "- ✅ Performance Tests (Load and stress testing)" >> test-summary.md
        echo "- ✅ Security Analysis (Vulnerability scanning)" >> test-summary.md
        
        echo "" >> test-summary.md
        echo "## Artifacts Generated" >> test-summary.md
        echo "" >> test-summary.md
        ls -la | grep "test-results\|performance\|web-validation\|security" >> test-summary.md
        
        echo "" >> test-summary.md
        echo "## Next Steps" >> test-summary.md
        echo "" >> test-summary.md
        echo "1. Review individual test reports for detailed results" >> test-summary.md
        echo "2. Check coverage reports to ensure adequate test coverage" >> test-summary.md
        echo "3. Address any security vulnerabilities identified" >> test-summary.md
        echo "4. Validate changes on actual ESP32-S3 hardware" >> test-summary.md
        echo "5. Update documentation based on test results" >> test-summary.md
        
        cat test-summary.md
        
    - name: Upload test summary
      uses: actions/upload-artifact@v3
      with:
        name: test-summary
        path: test-summary.md
        
    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('test-summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

  # Optional: Deploy test results to GitHub Pages for easy viewing
  deploy-test-reports:
    name: Deploy Test Reports
    runs-on: ubuntu-latest
    needs: test-summary
    if: github.ref == 'refs/heads/main' && always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download test artifacts
      uses: actions/download-artifact@v3
      
    - name: Prepare test reports for deployment
      run: |
        mkdir -p gh-pages/test-reports
        
        # Copy HTML reports
        find . -name "*.html" -exec cp {} gh-pages/test-reports/ \;
        
        # Create index page
        cat > gh-pages/test-reports/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>BMCU370 ESP32 Test Reports</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; }
                .report-link { display: block; margin: 10px 0; padding: 10px; background: #f0f0f0; text-decoration: none; border-radius: 5px; }
                .report-link:hover { background: #e0e0e0; }
            </style>
        </head>
        <body>
            <h1>BMCU370 ESP32 Web Interface Test Reports</h1>
            <p>Latest test results from continuous integration.</p>
        EOF
        
        # Add links to available reports
        for report in gh-pages/test-reports/*.html; do
          if [ "$(basename "$report")" != "index.html" ]; then
            echo "<a href=\"$(basename "$report")\" class=\"report-link\">$(basename "$report" .html)</a>" >> gh-pages/test-reports/index.html
          fi
        done
        
        echo "</body></html>" >> gh-pages/test-reports/index.html
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        destination_dir: test-reports